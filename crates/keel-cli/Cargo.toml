[package]
name = "keel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fast CLI for project board management"
publish = false

[package.metadata.wix]
upgrade-guid = "A1F530AB-C0A0-4811-8BF3-80A08ACC3E7F"
path-guid = "5B298B7E-F56C-43DB-A7E1-AA2A97424EA8"
license = false
eula = false

[package.metadata.deb]
maintainer = "keel contributors"
copyright = "2026, keel contributors"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """
keel is a fast CLI for agentic SDLC management."""

[package.metadata.generate-rpm]
summary = "Fast CLI for project board management"
assets = [
  { source = "target/release/keel", dest = "/usr/bin/keel", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/keel/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/doc/keel/LICENSE", mode = "644", doc = true },
]

[dependencies]
keel-core.workspace = true
spoke-auth.workspace = true
txt-scene.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
crossterm = "0.27"
colored = "2"
dirs = "6"
owo-colors = "4.2.3"
terminal_size = "0.4"
txtplot = { git = "https://github.com/rupurt/txtplot" }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
tempfile = "3"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
ansi-escape-sequences = "0.1.0"
